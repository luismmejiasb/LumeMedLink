# CI — compiles BOTH targets (S0.1 DoD). Gate honesty: this file has never run on GitHub until
# the author pushes — stated in PROGRESS, not hidden.
#
# PAUSED (2026-08-21, author's call): workflow_dispatch ONLY. The personal account hit 90% of its
# 2,000 Actions minutes and macOS runners bill at 10x — one real macOS minute costs ten. No
# automatic trigger comes back until the author re-enables it; running this by hand from the
# Actions tab is the deliberate act that spends the minutes.
#
# Cost layout for when it returns: the `gates` job runs on ubuntu (1x billing, seconds); only the
# `build` job needs macOS (Xcode toolchain for the iOS target, arm64 matches iosSimulatorArm64),
# and it only starts if the cheap gates already passed.
#
# Xcode requirement, learned from run #2 (17m36s of macOS burned to a link error): Compose
# Multiplatform 1.11.1 references iOS 26 SDK symbols (UIViewLayoutRegion, framework UIUtilities),
# so linking the simulator TEST binary dies on Xcode 16.x. The author's machine links green on
# Xcode 26.6 — the runner must match the SDK major, hence macos-26 plus an explicit selection
# step that fails loudly instead of linking 15 minutes toward an undefined symbol.
name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Constitution gates first: no JVM needed, seconds to run, and a violation should fail the
      # run before minutes of compilation, not after.
      - name: Gate — feature isolation (ADR-0008)
        run: Scripts/check-feature-isolation.sh
      - name: Gate — forbidden patterns (§6, §8, ADR-0007)
        run: Scripts/check-forbidden-patterns.sh
      - name: Gate — dependency allowlist (§8.8)
        run: Scripts/check-dependency-allowlist.sh
      - name: Gate — screen-capture protection (F1, ADR-0010)
        run: Scripts/check-screen-security.sh

  build:
    needs: gates
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Fail in seconds, not after 15 minutes of compilation: CMP 1.11.1 needs the iOS 26 SDK.
      - name: Select Xcode 26
        run: |
          XCODE_26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_26" ]; then
            echo "::error::No Xcode 26.x on this runner image — CMP 1.11.1 links against iOS 26 SDK symbols (see run #2)."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_26"
          xcodebuild -version

      # Same JDK the build pins via jvmToolchain; setup-java just makes it present on the runner.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Includes gradle-wrapper validation (checksum of the committed wrapper jar).
      - uses: gradle/actions/setup-gradle@v4

      - name: Lint (detekt + ktlint)
        run: ./gradlew detekt ktlintCheck

      - name: Build (Android + common) and compile iOS
        run: ./gradlew build :composeApp:compileKotlinIosSimulatorArm64
