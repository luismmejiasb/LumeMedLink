# Daemon JVM criteria — the DAEMON itself runs on 17, not just the compilations (jvmToolchain).
# Written by hand instead of `updateDaemonJvm` because that task insists on toolchain download
# URLs (foojay resolver), a dependency this repo does not want: JDK 17 is present locally
# (Temurin) and CI installs it via setup-java.
#
# Why the daemon version matters at all: detekt 1.23.8 runs in-process, and its embedded Kotlin
# compiler cannot parse the version string of a JDK 26 runtime (`JavaVersion.parse("26.0.1")`
# throws). With the daemon on 17, "it built locally" and "it built in CI" are the same statement
# for LINT too, not only for compilation.
toolchainVersion=17
