			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# KOTLIN_FRAMEWORK_BUILD_TYPE is NOT optional here, and its absence fails SILENTLY.\n# Without it KGP prints 'Unable to detect Kotlin framework build type' as a WARNING, does not\n# refresh build/xcode-frameworks, and the link then uses whatever framework was left there.\n# The build stays green while the app runs OLD Kotlin — which is exactly what happened between\n# 2026-08-25 and 2026-09-07 and invalidated every iOS device observation in that window.\ncd \"$SRCROOT/..\"\nif [ \"$CONFIGURATION\" = \"Release\" ]; then KFBT=release; else KFBT=debug; fi\nKOTLIN_FRAMEWORK_BUILD_TYPE=$KFBT ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode || {\n    # A FAILED Kotlin build must fail the app build. Without this line it did not: a build phase\n    # runs without -e, the last command below succeeds, and Xcode linked the PREVIOUS framework\n    # with the build green - measured 2026-10-07 (a lockfile miss failed Gradle; the app ran old\n    # Kotlin). Same silent staleness as ADR-0028 and ADR-0030, third door.\n    echo \"error: the Kotlin framework did not build - refusing to link a stale one\"\n    exit 1\n}\n\n# MAKE THE LINK SEE THE FRAMEWORK, through a source file Xcode compiles (task 0025, amending ADR-0030).\n# Nothing Xcode tracks points at this framework: it is a STATIC framework pulled in by\n# OTHER_LDFLAGS -framework, so a Kotlin-only edit left the app binary BYTE-IDENTICAL (ADR-0030).\n# The first fix deleted the linked product from here - and the build had already been PLANNED without\n# a link step, so the first build after a Kotlin change failed at CodeSign (\"No such file\") and only the\n# second linked (measured 2026-10-07). Instead: a generated Swift file carries the framework's stamp. It is\n# an OUTPUT of this phase, so Xcode compiles it; when the framework moves its content moves, the object\n# changes, and the link runs in the SAME build, planned like any other. It is written only when the\n# stamp changed, so an unchanged framework recompiles nothing.\nFW=\"$SRCROOT/../composeApp/build/xcode-frameworks/$CONFIGURATION/$SDK_NAME/LumeMedLink.framework/LumeMedLink\"\nSTAMP_SWIFT=\"$DERIVED_FILE_DIR/KotlinFrameworkStamp.swift\"\nmkdir -p \"$DERIVED_FILE_DIR\"\nNOW=$(stat -f '%m %z' \"$FW\" 2>/dev/null || echo absent)\nWANTED=\"// Generated by the Build Kotlin framework phase (task 0025). Do not edit. kotlin-framework.stamp\nenum KotlinFrameworkStamp { static let value = \\\"$NOW\\\" }\"\nif [ \"$WANTED\" != \"$(cat \"$STAMP_SWIFT\" 2>/dev/null)\" ]; then\n    echo \"note: Kotlin framework changed - its stamp moves, so the app links again\"\n    printf '%s\\n' \"$WANTED\" > \"$STAMP_SWIFT\"\nfi\n";
		};
