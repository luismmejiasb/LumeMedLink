# detekt — LumeMedLink
#
# `buildUponDefaultConfig = false` on purpose: this is NOT a general style linter. Formatting is
# ktlint's job (.editorconfig); the ADR-0008 tree contract is Scripts/check-feature-isolation.sh's;
# the content gates that need to see CALL SITES are Scripts/check-forbidden-patterns.sh's. What
# lives here is the small subset of detekt's own built-in rules that carry constitution weight and
# work SYNTACTICALLY.
#
# Deliberately absent, stated so nobody assumes coverage (§9 — a gate is never faked):
# - ForbiddenMethodCall: requires type resolution, and the plain `detekt` task this repo runs
#   never resolves types — the rule would stay green forever, a dead gate. Call-shaped bans
#   (getSharedPreferences, share sheets) live in Scripts/check-forbidden-patterns.sh instead.
# - no_mutable_object / no_hardcoded_style: need a compiled custom rule set (detekt takes custom
#   rules as Kotlin classes, not YAML). Still [manual] in CLAUDE.md §13 — declared debt, not faked.

build:
  maxIssues: 0

coroutines:
  active: true
  # no_globalscope, first line of defense. Verified against a bait file before being trusted;
  # Scripts/check-forbidden-patterns.sh hunts the identifier repo-wide as the second line.
  GlobalCoroutineUsage:
    active: true

complexity:
  active: true
  LongParameterList:
    active: true
    functionThreshold: 12
    constructorThreshold: 12
    ignoreDefaultParameters: true

potential-bugs:
  active: true
  IgnoredReturnValue:
    active: true
  UnsafeCallOnNullableType:
    active: true

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: true
  SwallowedException:
    active: true

style:
  active: true
  ForbiddenComment:
    active: true
    comments:
      - reason: "A TODO with no owner and no date is debt nobody will pay."
        value: "TODO:"
      - reason: "A FIXME on main means the slice did not close (§13)."
        value: "FIXME:"
  MaxLineLength:
    active: true
    maxLineLength: 120
  # The import-shaped constitution gates. `excludes` carves out `core/` — the infrastructure edge
  # where the network stack and the secret store legitimately live (ADR-0004, ADR-0005, ADR-0008);
  # inside core/ the constitution + ADR review are the gate. Everywhere else these are defects.
  ForbiddenImport:
    active: true
    # ANCHORED to the real tree, not to any directory called `core`. The glob used to be
    # `**/core/**`, which matches at ANY depth — so creating `features/<area>/core/` silently
    # disabled this whole gate for those files. Verified with a bait pair: the same detekt run
    # flagged `features/agenda/PlainFeature.kt` and said nothing about
    # `features/agenda/core/SneakyCore.kt`, which imported both Ktor and OkHttp.
    # Scripts/check-feature-isolation.sh now also refuses a stray `core` directory.
    excludes: ['**/lumemedlink/core/**']
    imports:
      # no_raw_networking (§7, ADR-0004): no HTTP client outside the stack.
      - value: 'okhttp3.*'
        reason: 'Raw OkHttp outside core/networking. All traffic goes through the hardened stack (ADR-0004).'
      - value: 'java.net.HttpURLConnection'
        reason: 'Raw HTTP client. All traffic goes through the hardened stack (ADR-0004).'
      - value: 'io.ktor.*'
        reason: 'Ktor is an implementation detail of core/networking. Features talk to its interfaces (ADR-0004).'
      # The named holes an adversarial review found in this list (F12, ADR-0016): every one of
      # these opens a socket that never passes the hardened stack — no https-only check, no
      # redacted log, no bounded retry, and on Android not even the app's TLS trust decisions.
      - value: 'java.net.URL'
        reason: 'openConnection() is a raw HTTP client in disguise. All traffic goes through the stack (ADR-0004).'
      - value: 'java.net.Socket'
        reason: 'A raw socket bypasses TLS policy entirely (ADR-0004).'
      - value: 'javax.net.ssl.*'
        reason: 'TLS is configured once, inside core/networking. A second trust decision is how a bypass is built.'
      - value: 'android.webkit.*'
        reason: 'A WebView has its own network stack, its own cookie jar and its own cache (ADR-0004, §8.5).'
      - value: 'android.app.DownloadManager'
        reason: 'It fetches outside the stack and writes to shared storage (ADR-0004, §8.5).'
      - value: 'platform.Foundation.NSURLSession'
        reason: 'The iOS raw networking surface. Traffic goes through core/networking (ADR-0004).'
      - value: 'platform.Foundation.NSURLConnection'
        reason: 'The iOS raw networking surface, deprecated at that (ADR-0004).'
      - value: 'platform.WebKit.*'
        reason: 'WKWebView carries its own network stack and cache (ADR-0004, §8.5).'
      # secrets_gate (§8.4, ADR-0005): plain-file storage APIs stay out of reach of features.
      - value: 'android.content.SharedPreferences'
        reason: 'Plain-file storage. Secrets live in Keystore/Keychain; anything else needs a core/ seam (ADR-0005).'
      - value: 'androidx.datastore.*'
        reason: 'Plain-file storage. Secrets live in Keystore/Keychain; anything else needs a core/ seam (ADR-0005).'
      # Dependency denylist, import-shaped second line (§8.1, §8.8; the first line is
      # Scripts/check-dependency-allowlist.sh at the Gradle edge).
      - value: 'com.google.firebase.*'
        reason: 'Default-deny of crash/analytics SDKs (§8.1).'
      - value: 'io.sentry.*'
        reason: 'Default-deny of crash/analytics SDKs (§8.1).'
      - value: 'coil.*'
        reason: 'Image loader with its own network path. Remote bytes go through the stack (§7).'
      - value: 'coil3.*'
        reason: 'Image loader with its own network path. Remote bytes go through the stack (§7).'
      - value: 'com.bumptech.glide.*'
        reason: 'Image loader with its own network path. Remote bytes go through the stack (§7).'
      - value: 'com.squareup.picasso.*'
        reason: 'Image loader with its own network path. Remote bytes go through the stack (§7).'
